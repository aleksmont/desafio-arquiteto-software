# Ambiente descartável exclusivo do ensaio: sem portas do host ou .env obrigatório.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ledger_load
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: load-admin-only
      LEDGER_APP_PASSWORD: load-runtime-only
    tmpfs: [/var/lib/postgresql]
    volumes:
      - ./src/Ledger.Api/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/migrations/002-protect-journal.sql:/docker-entrypoint-initdb.d/002-protect-journal.sql:ro
      - ./database/migrations/003-runtime-permissions.sql:/docker-entrypoint-initdb.d/003-runtime-permissions.sql:ro
      - ./database/004-configure-runtime.sh:/docker-entrypoint-initdb.d/004-configure-runtime.sh:ro
      - ./database/migrations/005-account-ownership.sql:/docker-entrypoint-initdb.d/005-account-ownership.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U ledger -d ledger_load']
      interval: 1s
      timeout: 3s
      retries: 60
  api:
    build: .
    environment:
      ConnectionStrings__Ledger: Host=db;Database=ledger_load;Username=ledger_app;Password=load-runtime-only
      ApiKey: load-test-service-key-at-least-32-characters
      Logging__LogLevel__Default: Warning
    depends_on:
      db:
        condition: service_healthy
  load:
    image: python:3.13-slim
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    environment:
      BASE_URL: http://api:8080
      API_KEY: load-test-service-key-at-least-32-characters
      LOAD_REQUESTS: ${LOAD_REQUESTS:-6000}
      LOAD_REPORT: /results/load.json
    volumes:
      - ./scripts/load/run.py:/run-load.py:ro
      - ${LOAD_RESULTS_DIR:-./artifacts/load}:/results
    command: [python, /run-load.py]
    depends_on: [api]
