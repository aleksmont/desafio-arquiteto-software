services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: local-only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ledger-data:/var/lib/postgresql
      - ./src/Ledger.Api/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/migrations/002-protect-journal.sql:/docker-entrypoint-initdb.d/002-protect-journal.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ConnectionStrings__Ledger: Host=db;Database=ledger;Username=ledger;Password=local-only;Timeout=5;Command Timeout=10
      ApiKey: ${API_KEY:?Defina API_KEY no arquivo .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  ledger-data:
