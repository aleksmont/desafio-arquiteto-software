services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: local-only
      LEDGER_APP_PASSWORD: ${LEDGER_APP_PASSWORD:?Defina LEDGER_APP_PASSWORD no arquivo .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ledger-data:/var/lib/postgresql
      - ./src/Ledger.Api/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/migrations/002-protect-journal.sql:/docker-entrypoint-initdb.d/002-protect-journal.sql:ro
      - ./database/migrations/003-runtime-permissions.sql:/docker-entrypoint-initdb.d/003-runtime-permissions.sql:ro
      - ./database/004-configure-runtime.sh:/docker-entrypoint-initdb.d/004-configure-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ConnectionStrings__Ledger: Host=db;Database=ledger;Username=ledger_app;Password=${LEDGER_APP_PASSWORD:?Defina LEDGER_APP_PASSWORD no arquivo .env};Timeout=5;Command Timeout=10
      ApiKey: ${API_KEY:?Defina API_KEY no arquivo .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  ledger-data:
